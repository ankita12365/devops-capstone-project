[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-html=1
cover-html-dir=coverage

[coverage:run]
source = service
omit =
    tests/*
    setup.py

[coverage:report]
show_missing = True

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    docs/source/conf.py,
    old,
    build,
    dist
per-file-ignores =
    service/__init__.py:F401

[pylint.messages control]
disable =
    C0111,
    R0903,
    W0621,
    E1101
