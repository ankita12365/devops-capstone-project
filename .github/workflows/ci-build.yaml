name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nose coverage flake8 pylint

      - name: Lint with flake8
        run: |
          flake8 service/ --max-line-length=120 --exclude=__pycache__
          echo "Linting passed!"

      - name: Run unit tests with nosetests
        run: |
          nosetests --with-spec --spec-color --with-coverage --cover-package=service
        env:
          DATABASE_URI: "postgresql://postgres:postgres@postgres:5432/testdb"
